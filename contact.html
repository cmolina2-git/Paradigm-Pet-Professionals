<!DOCTYPE html>
<html lang="en">

    <head>

        <link rel="stylesheet" href="Main.css">
        <meta charset="UTF-8">
        <title>Contact Page</title>
        
    </head>

    <body>
        
        <header>
            
            <a href="home.html"><image src="pictures/petshoplogo.png" alt="Paradigm Pet Professionals Logo" width="125" height="125"></a>
            
            <div>
                
                <h1 class="Company Name">Paradigm Pet Professionals</h1>

                <p>based pet care advice for every pet lover</p>

            </div>

            <a class="button" href="#popup">Sign Up</a>

        </header>

        <nav>

            <div>

            </div>

            <div class="nav">

                <a href="home.html">Home</a>
                <a href="dog.html">Pet</a>
                <a class="Here" href="contact.html">Contact</a>

            </div>
                
            <div class="searchbar">

                <input type="text" class="textArea" 
                id="lName" name="lastName" style="width: 200px; height: 20px;" placeholder="Search">
                
                <button>Fetch</button>

            </div>

        </nav>
        
        <main>

            <aside class="left">

                    <p class="secondnav"><a class="Here" href="contact.html">Contact</a></p>
                    <p class="secondnav"><a href="faq.html">FAQ</a></p>

            </aside>

            
            <aside class="right">
        

                <section class="contactsec">

                    <div>

                        <h2 class="secheader">Contact Us</h2>

                    </div>

                    <div >

                        <label for="name" style="padding-right: 10px;">Name:</label>
                        <input type="text" class="textArea" 
                        id="name" name="name" style="width: 500px; height: 20px;" placeholder="First Name Last Name" required>
                            
                    </div>

                    <div style="padding-top: 5px;">

                        <label for="phoneNumber" style="padding-right: 10px;">Phone Number:</label>
                        <input type="text" class="textArea" 
                        id="phoneNumber" name="phoneNumber" style="width: 500px; height: 20px;" placeholder="XXX-XXX-XXXX" required>
                            
                    </div>

                    <div style="padding-top: 5px;">

                        <label for="email" style="padding-right: 10px;">Email Address:</label>
                        <input type="email" class="textArea" id ="emailInput" name="email"
                        style="width: 500px; height: 20px;" placeholder="example@email.com" required>

                    </div>

                    <div style="padding-top: 5px;">

                        <label for="petName" style="padding-right: 10px;">Pet Name:</label>
                        <input type="text" class="textArea" 
                        id="petName" name="petName" style="width: 500px; height: 20px;" placeholder="Pet Name" required>
                            
                    </div>

                    <div style="padding-top: 5px;">

                        <label for="petType" style="padding-right: 10px; ">Pet Type:</label>
                        <input type="text" class="textArea" 
                        id="petType" name="petType" style="width: 500px; height: 20px;" placeholder="Pet Type" required>
                            
                    </div>

                    <div style="padding-top: 5px;">

                        <label for="petAge" style="padding-right: 10px;">Pet Age:</label>
                        <input type="text" class="textArea" 
                        id="petAge" name="petAge" style="width: 300px; height: 20px;" placeholder="Pet Age" required>
                            
                    </div>

                    <div style="padding-top: 5px;">

                        <button>Submit</button>

                    </div>

                </section>

            </aside>

        </main>

        <footer> 

            <a href="#popup2" class="shareUs">Share</a>

            <div class="spacer"></div>

            <div>

                <img class="footerimg" src="pictures/Paradigm Professional.png" alt="Paradigm Pet Professionals" width="100" height="50">
                
            </div>
            
        </footer>

        <div id="popup" class="popup">

            <section class="newsletter">

                <div>

                    <h3>News Letter Sign Up</h3>

                </div>

                <div>

                    <label for="firstName">First Name:</label>

                    <input type="text" class="textArea" id="fName" name="firstName" style="width: 100px; height: 20px;" required>
                        
                </div>
                
                <div>

                    <label for="lastName">Last Name:</label>

                    <input type="text" class="textArea" id="lName" name="lastName" style="width: 100px; height: 20px;" required>

                </div>

                <div>
                        
                    <label for="email">Email Address:</label>

                    <input type="email" class="textArea" id ="emailInput" name="email" style="width: 120px; height: 20px;" placeholder="example@email.com" required>

                </div>

                <a class="final" class="" href="#">Sign Up</a>
                
            </section>
                
        </div>

        <div id="popup2" class="popup">

            <section class="share">

                <div>

                    <h3>Share Us:</h3>

                    <a href="https://www.instagram.com/"><img class="shareImg" src="pictures/Instagram Logo.png"></a>

                    <a href="https://x.com/"><img class="shareImg" src="pictures/X Logo.png"></a>

                    <a href="https://www.facebook.com/"><img class="shareImg" src="pictures/Facebook Logo.png"></a>

                </div>

                <a class="final" class="" href="#">Exit</a>
                
            </section>

        </div>

    </body>

</html>
